apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  annotations:
    ai-grid/version: "1"
    maas.opendatahub.io/retain-api-keys-on-delete: "true"
    openshift.io/display-name: demo-run-sub
  name: demo-run-sub
  namespace: models-as-a-service
spec:
  modelRefs:
  - name: demo-run-cpu
    namespace: models-as-a-service
    tokenRateLimits:
    - limit: 10000
      window: 1m
  organization:
    id: c3091d48-02f9-4be6-8299-af682812de1b
  owner:
    groups:
    - name: c3091d48-02f9-4be6-8299-af682812de1b/ai-grid-users
    users: []
  priority: 0
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  annotations:
    openshift.io/display-name: demo-run-sub
  labels:
    ai-grid/subscription: demo-run-sub
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: demo-run-sub-policy
  namespace: models-as-a-service
spec:
  modelRefs:
  - name: demo-run-cpu
    namespace: models-as-a-service
  subjects:
    groups:
    - name: c3091d48-02f9-4be6-8299-af682812de1b/ai-grid-users
    users: []
