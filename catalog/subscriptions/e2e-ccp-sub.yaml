apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSSubscription
metadata:
  annotations:
    ai-grid/version: "1"
    maas.opendatahub.io/retain-api-keys-on-delete: "true"
    openshift.io/description: Shared-env e2e subscription
    openshift.io/display-name: e2e-ccp-sub
  name: e2e-ccp-sub
  namespace: models-as-a-service
spec:
  modelRefs:
  - name: e2e-ccp-cpu
    namespace: models-as-a-service
    tokenRateLimits:
    - limit: 1000
      window: 1h
  organization:
    id: 8f17905b-d292-44bc-8034-c78304e0d323
  owner:
    groups:
    - name: 8f17905b-d292-44bc-8034-c78304e0d323/ai-grid-users
    users: []
  priority: 0
---
apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  annotations:
    openshift.io/description: Shared-env e2e subscription
    openshift.io/display-name: e2e-ccp-sub
  labels:
    ai-grid/subscription: e2e-ccp-sub
    app.kubernetes.io/managed-by: ai-grid-provider-backend
  name: e2e-ccp-sub-policy
  namespace: models-as-a-service
spec:
  modelRefs:
  - name: e2e-ccp-cpu
    namespace: models-as-a-service
  subjects:
    groups:
    - name: 8f17905b-d292-44bc-8034-c78304e0d323/ai-grid-users
    users: []
